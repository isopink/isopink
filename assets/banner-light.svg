<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Lee: robotics and AI agents, Seoul</title>
  <desc id="d">A robot's map: a dashed path leads from the robot to a remembered object marked with an uncertainty ellipse.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D8DEE4" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m">
      <rect x="520" y="0" width="680" height="280" fill="url(#fade)"/>
    </mask>
    <clipPath id="frame">
      <rect x="0.5" y="0.5" width="1199" height="279" rx="14"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="279" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>

  <g clip-path="url(#frame)">
    <g mask="url(#m)">
      <rect x="520" y="0" width="680" height="280" fill="url(#grid)"/>

      <!-- walls -->
      <g fill="none" stroke="#8C959F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M760 40H1140V240H760"/>
        <path d="M940 40V110"/>
        <path d="M940 160V240"/>
        <path d="M1040 150H1140"/>
      </g>

      <!-- other remembered objects -->
      <g fill="none" stroke="#8C959F" stroke-width="1.25">
        <ellipse cx="1090" cy="88" rx="20" ry="9" transform="rotate(-24 1090 88)"/>
        <ellipse cx="850" cy="204" rx="15" ry="8" transform="rotate(38 850 204)"/>
      </g>
      <g fill="#8C959F">
        <circle cx="1090" cy="88" r="3"/>
        <circle cx="850" cy="204" r="3"/>
      </g>

      <!-- path: robot -> goal -->
      <path d="M800 84 C 860 84, 900 132, 940 135 S 1010 150, 1036 196"
            fill="none" stroke="#BF3989" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>

      <!-- robot -->
      <circle cx="800" cy="84" r="11" fill="#F6F8FA" stroke="#1F2328" stroke-width="2"/>
      <path d="M800 84H811" stroke="#1F2328" stroke-width="2" stroke-linecap="round"/>

      <!-- goal with covariance ellipse -->
      <ellipse cx="1052" cy="206" rx="30" ry="14" transform="rotate(-18 1052 206)" fill="#BF3989" fill-opacity="0.1" stroke="#BF3989" stroke-width="1.5"/>
      <circle cx="1052" cy="206" r="4.5" fill="#BF3989"/>
      <text x="1090" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#BF3989">p = 0.82</text>
    </g>
  </g>

  <!-- text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.6" fill="#656D76">ROBOTICS  ·  AI AGENTS  ·  SEOUL</text>
    <text x="62" y="156" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#1F2328">Lee</text>
    <rect x="64" y="182" width="36" height="3" rx="1.5" fill="#BF3989"/>
    <text x="64" y="226" font-size="23" fill="#424A53">I build things that interact with the real world.</text>
  </g>
</svg>
